name: Feature request
description: An idea to make keepclip better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        keepclip tries to stay small: copy a link, pick a size, done. Ideas that keep it that way are the easiest to take in.
        Please search the open issues first: someone may have asked already.
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The situation first, then the solution. For example, "When I ..., I want to ...".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could keepclip help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or thought about.
