[package]
name = "keepclip-system"
version.workspace = true
description = "What both keepclip programs share: runs yt-dlp, downloads the tools, keeps the settings file, reads the clipboard and shows the notification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keepclip-core.workspace = true
# Standard folders: settings, local data, Downloads.
dirs = "7"
# Checks the SHA-256 of each downloaded tool against the published one.
sha2 = "0.11"
# Downloads the tools (yt-dlp, ffmpeg, Deno) over HTTPS on the first run.
ureq = "3"
# Unpacks ffmpeg and Deno, which come zipped. Deflate is all they use.
zip = { version = "9", default-features = false, features = ["deflate"] }

# Clipboard, the finished notification, and the job object that ends yt-dlp
# together with the programs it starts.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
