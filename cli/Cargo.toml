[package]
# The package name is also the executable name (keepclip-cli.exe).
name = "keepclip-cli"
version.workspace = true
description = "Download a video from a copied link, with yt-dlp doing the work: the console version."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keepclip-core.workspace = true
keepclip-system.workspace = true

# Whether keepclip has the console window to itself.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Console"] }
