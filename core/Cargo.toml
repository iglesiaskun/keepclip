# The directory is called `core`, but the package cannot be: `core` is the name
# of Rust's built-in library and the two names would clash.
[package]
name = "keepclip-core"
version.workspace = true
description = "Pure logic of keepclip: reads what yt-dlp reports, builds the menu and the download arguments, with no Windows dependency."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# Reads the video information that `yt-dlp -J` prints.
serde_json.workspace = true
toml.workspace = true
