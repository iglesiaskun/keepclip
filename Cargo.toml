[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
# The version of the release, for every crate.
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
# keepclip is an app, not a library for crates.io.
publish = false

[workspace.dependencies]
keepclip-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
